<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TruongPaper Video Host</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    #bg-blur {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      object-fit: cover;
      filter: blur(48px) saturate(180%) brightness(0.65);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 1;
    }
    #fg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="bg-blur" aria-hidden="true"></canvas>
  <video id="fg-video" autoplay loop muted playsinline></video>

  <script>
    (function () {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const rawFile = params.get('file') || '';
      const videoPath = rawFile.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
      const videoUrl = new URL('./' + videoPath, window.location.href).href;

      const bgBlur = document.getElementById('bg-blur');
      let fgVideo = document.getElementById('fg-video');
      const FAST_SCALE = 1.5;
      let sourceScale = 1;
      let fastUrl = null;
      let pending = null;
      let paused = false;
      let adjustments = {};
      let originalWidth = 0;
      let originalHeight = 0;

      let blurEnabled = false;
      let lastBackdropAt = -Infinity;
      function paintBackdrop() {
        if (!blurEnabled || fgVideo.readyState < 2 || !fgVideo.videoWidth) return;
        const scale = 192 / Math.max(fgVideo.videoWidth, fgVideo.videoHeight);
        const width = Math.max(1, Math.round(fgVideo.videoWidth * scale));
        const height = Math.max(1, Math.round(fgVideo.videoHeight * scale));
        if (bgBlur.width !== width || bgBlur.height !== height) {
          bgBlur.width = width;
          bgBlur.height = height;
        }
        bgBlur.getContext('2d')?.drawImage(fgVideo, 0, 0, width, height);
        lastBackdropAt = performance.now();
      }
      function watchVideo(video) {
        video.addEventListener('loadeddata', paintBackdrop);
        video.addEventListener('seeked', paintBackdrop);
        // A blurred backdrop only needs occasional samples from the already decoded video.
        video.addEventListener('timeupdate', () => {
          if (performance.now() - lastBackdropAt >= 83) paintBackdrop();
        });
      }

      function requestedRate() {
        return Math.min(3.0, Math.max(0.1, Number(adjustments.playbackSpeed ?? 1.0)));
      }

      function applyAdjustments() {
        const adj = adjustments;
        const fitMode = adj.fitMode || 'fill';
        const fit = { fit_blur: 'contain', fit_black: 'contain', stretch: 'fill', center: 'none' };
        const centerAtOriginalSize = fitMode === 'center' && sourceScale !== 1 && originalWidth && originalHeight;
        fgVideo.style.objectFit = centerAtOriginalSize ? 'fill' : (fit[fitMode] || 'cover');
        fgVideo.style.width = centerAtOriginalSize ? `${originalWidth}px` : '';
        fgVideo.style.height = centerAtOriginalSize ? `${originalHeight}px` : '';
        fgVideo.style.left = centerAtOriginalSize ? `calc((100% - ${originalWidth}px) / 2)` : '';
        fgVideo.style.top = centerAtOriginalSize ? `calc((100% - ${originalHeight}px) / 2)` : '';
        const nextBlurEnabled = fitMode === 'fit_blur';
        if (blurEnabled !== nextBlurEnabled) {
          blurEnabled = nextBlurEnabled;
          if (blurEnabled) paintBackdrop();
          bgBlur.style.opacity = blurEnabled ? '1' : '0';
        }

        const muted = Boolean(adj.muted) || (adj.volume ?? 0) <= 0.001;
        fgVideo.muted = muted;
        fgVideo.volume = muted ? 0 : Math.min(1, Math.max(0, Number(adj.volume ?? 1)));

        const rate = requestedRate() / sourceScale;
        if (fgVideo.playbackRate !== rate) fgVideo.playbackRate = rate;

        const zoom = Number(adj.zoom ?? 1.0);
        const ox = Number(adj.offsetX ?? 0.0) * 50;
        const oy = Number(adj.offsetY ?? 0.0) * 50;
        fgVideo.style.transform = zoom === 1 && ox === 0 && oy === 0
          ? 'none' : `scale(${zoom}) translate(${ox}vw, ${oy}vh)`;

        const br = 1 + Number(adj.brightness ?? 0.0);
        const ct = Number(adj.contrast ?? 1.0);
        const sat = Number(adj.saturation ?? 1.0);
        const hue = Number(adj.hueShift ?? 0.0);
        fgVideo.style.filter = br === 1 && ct === 1 && sat === 1 && hue === 0
          ? 'none' : `brightness(${br}) contrast(${ct}) saturate(${sat}) hue-rotate(${hue}rad)`;
      }

      function release(video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }

      function cancelPending() {
        if (!pending) return;
        const old = pending;
        pending = null;
        clearTimeout(old.timeout);
        release(old.video);
      }

      function syncSource() {
        const scale = fastUrl && requestedRate() > 2 ? FAST_SCALE : 1;
        if (scale === sourceScale) {
          cancelPending();
          return;
        }
        if (pending?.scale === scale) return;
        cancelPending();
        const next = document.createElement('video');
        next.muted = true;
        next.loop = true;
        next.playsInline = true;
        next.preload = 'auto';
        const job = { video: next, scale, positioned: false };
        pending = job;

        function finish() {
          if (pending !== job || !job.positioned || next.seeking || next.readyState < 2) return;
          const previous = fgVideo;
          previous.pause();
          pending = null;
          clearTimeout(job.timeout);
          next.id = 'fg-video';
          fgVideo = next;
          sourceScale = scale;
          watchVideo(next);
          applyAdjustments();
          previous.replaceWith(next);
          release(previous);
          paintBackdrop();
          if (!paused) next.play().catch(() => {});
        }
        function fail() {
          if (pending !== job) return;
          if (scale === FAST_SCALE) fastUrl = null;
          cancelPending();
        }
        next.addEventListener('loadedmetadata', () => {
          if (pending !== job) return;
          const time = fgVideo.currentTime * sourceScale / scale;
          if (Number.isFinite(next.duration) && next.duration > 0) {
            next.currentTime = time % next.duration;
          }
          job.positioned = true;
          finish();
        }, { once: true });
        next.addEventListener('loadeddata', finish);
        next.addEventListener('seeked', finish);
        next.addEventListener('error', fail, { once: true });
        job.timeout = setTimeout(fail, 15000);
        next.src = scale === FAST_SCALE ? fastUrl : videoUrl;
        next.load();
      }

      window.__truongpaper_set_fast_video = function (path) {
        fastUrl = new URL('./' + path, window.location.href).href;
        syncSource();
      };

      window.__truongpaper_apply_video_adjustments = function (adj) {
        if (!adj) return;
        adjustments = adj;
        applyAdjustments();
        syncSource();
      };

      window.__truongpaper_set_paused = function (nextPaused) {
        paused = nextPaused;
        if (paused) {
          fgVideo.pause();
        } else {
          fgVideo.play().catch(() => {});
        }
      };

      // WKWebView can suspend muted media while the desktop window is occluded.
      // Recover on reveal, including when the fast copy was prepared in the background.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !paused && fgVideo.paused) fgVideo.play().catch(() => {});
      });

      watchVideo(fgVideo);
      fgVideo.addEventListener('loadedmetadata', () => {
        originalWidth = fgVideo.videoWidth;
        originalHeight = fgVideo.videoHeight;
      }, { once: true });
      fgVideo.src = videoUrl;
      fgVideo.play().catch(() => {});
    })();
  </script>
</body>
</html>
