<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TruongPaper Video Host</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #bg-blur {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      object-fit: cover;
      filter: blur(48px) saturate(180%) brightness(0.65);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 1;
    }
    #fg-video, #held-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      pointer-events: none;
      z-index: 2;
    }
    #fg-video { visibility: hidden; }
    #held-frame { z-index: 3; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="bg-blur" aria-hidden="true"></canvas>
  <video id="fg-video" loop muted playsinline></video>
  <canvas id="held-frame" hidden aria-hidden="true"></canvas>

  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const videoPath = (params.get('file') || '').replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
      const video = document.getElementById('fg-video');
      const held = document.getElementById('held-frame');
      const backdrop = document.getElementById('bg-blur');
      const mac = /Mac/.test(navigator.platform);
      let hostPaused = false;
      let hiddenBySpace = false;
      let hasFrame = false;
      let awaitingFrame = false;
      let frameRequest;
      let resumedAt = 0;
      let lastSnapshot = -Infinity;
      let lastBackdrop = -Infinity;
      let adjustments = {};

      function snapshot(canvas, maxEdge) {
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !video.videoWidth) return false;
        const scale = Math.min(1, maxEdge / Math.max(video.videoWidth, video.videoHeight));
        const width = Math.max(1, Math.round(video.videoWidth * scale));
        const height = Math.max(1, Math.round(video.videoHeight * scale));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        const ctx = canvas.getContext('2d', { alpha: false });
        if (!ctx) return false;
        ctx.drawImage(video, 0, 0, width, height);
        return true;
      }

      function rememberFrame() {
        if (snapshot(held, 960)) {
          hasFrame = true;
          lastSnapshot = performance.now();
        }
      }

      function showHeldFrame() {
        awaitingFrame = false;
        if (frameRequest !== undefined) video.cancelVideoFrameCallback?.(frameRequest);
        frameRequest = undefined;
        held.hidden = !hasFrame;
        video.style.visibility = 'hidden';
      }

      function showFreshFrame() {
        if (!awaitingFrame || video.paused || hostPaused || hiddenBySpace) return;
        awaitingFrame = false;
        if (frameRequest !== undefined) video.cancelVideoFrameCallback?.(frameRequest);
        frameRequest = undefined;
        held.hidden = true;
        if (mac) rememberFrame();
      }

      function syncPlayback() {
        if (hostPaused || hiddenBySpace) {
          // Keep the last frame we observed while the decoder was advancing.
          if (!mac || !hasFrame) rememberFrame();
          showHeldFrame();
          video.pause();
          return;
        }
        if (!video.paused && video.style.visibility === 'visible') return;
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) video.style.visibility = 'visible';
        awaitingFrame = true;
        resumedAt = video.currentTime;
        frameRequest = video.requestVideoFrameCallback?.(showFreshFrame);
        video.play().catch(showHeldFrame);
      }

      video.addEventListener('loadeddata', () => {
        if (!hasFrame) rememberFrame();
        if (hostPaused || hiddenBySpace) {
          showHeldFrame();
        } else {
          held.hidden = !hasFrame;
          video.style.visibility = 'visible';
        }
      });
      video.addEventListener('pause', () => {
        if (video.paused) showHeldFrame();
      });
      video.addEventListener('waiting', () => {
        if (hasFrame) held.hidden = false;
        awaitingFrame = true;
        resumedAt = video.currentTime;
        if (frameRequest === undefined) frameRequest = video.requestVideoFrameCallback?.(showFreshFrame);
      });
      video.addEventListener('timeupdate', () => {
        if (awaitingFrame && video.currentTime !== resumedAt) showFreshFrame();
        if (video.paused || hiddenBySpace) return;
        const now = performance.now();
        if (mac && now - lastSnapshot >= 500) rememberFrame();
        if (adjustments.fitMode === 'fit_blur' && now - lastBackdrop >= 83) {
          if (snapshot(backdrop, 192)) lastBackdrop = now;
        }
      });

      function applyAdjustments() {
        const adj = adjustments;
        const fitMode = adj.fitMode || 'fill';
        const fit = { fit_blur: 'contain', fit_black: 'contain', stretch: 'fill', center: 'none' };
        const originalSize = fitMode === 'center' && video.videoWidth && video.videoHeight;
        const zoom = Number(adj.zoom ?? 1);
        const x = Number(adj.offsetX ?? 0) * 50;
        const y = Number(adj.offsetY ?? 0) * 50;
        const brightness = 1 + Number(adj.brightness ?? 0);
        const contrast = Number(adj.contrast ?? 1);
        const saturation = Number(adj.saturation ?? 1);
        const hue = Number(adj.hueShift ?? 0);
        for (const layer of [video, held]) {
          const centeredStill = layer === held && originalSize;
          layer.style.objectFit = centeredStill ? 'fill' : (fit[fitMode] || 'cover');
          layer.style.width = centeredStill ? `${video.videoWidth}px` : '';
          layer.style.height = centeredStill ? `${video.videoHeight}px` : '';
          layer.style.left = centeredStill ? `calc((100% - ${video.videoWidth}px) / 2)` : '';
          layer.style.top = centeredStill ? `calc((100% - ${video.videoHeight}px) / 2)` : '';
          layer.style.transform = zoom === 1 && x === 0 && y === 0 ? 'none' : `scale(${zoom}) translate(${x}vw, ${y}vh)`;
          layer.style.filter = brightness === 1 && contrast === 1 && saturation === 1 && hue === 0
            ? 'none' : `brightness(${brightness}) contrast(${contrast}) saturate(${saturation}) hue-rotate(${hue}rad)`;
        }
        document.body.style.background = !mac || fitMode === 'fit_black' || fitMode === 'center' ? '#000' : '';
        backdrop.style.opacity = fitMode === 'fit_blur' ? '1' : '0';
        if (fitMode === 'fit_blur' && snapshot(backdrop, 192)) lastBackdrop = performance.now();

        const volume = Number(adj.volume ?? 0);
        video.muted = Boolean(adj.muted) || volume <= 0.001;
        video.volume = video.muted ? 0 : Math.min(1, Math.max(0, volume));
        const rate = Math.min(2, Math.max(0.1, Number(adj.playbackSpeed ?? 1)));
        if (video.playbackRate !== rate) video.playbackRate = rate;
      }

      window.__truongpaper_apply_video_adjustments = function (next) {
        if (!next) return;
        adjustments = next;
        applyAdjustments();
      };
      window.__truongpaper_set_paused = function (paused) {
        hostPaused = paused;
        syncPlayback();
      };
      document.addEventListener('visibilitychange', () => {
        hiddenBySpace = mac && document.hidden;
        syncPlayback();
      });
      video.addEventListener('loadedmetadata', applyAdjustments);
      applyAdjustments();
      video.src = new URL('./' + videoPath, window.location.href).href;
      syncPlayback();
    })();
  </script>
</body>
</html>
