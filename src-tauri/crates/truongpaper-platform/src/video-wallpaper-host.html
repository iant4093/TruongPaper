<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TruongPaper Video Host</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    #bg-blur {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      object-fit: cover;
      filter: blur(48px) saturate(180%) brightness(0.65);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 1;
    }
    #fg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="bg-blur" aria-hidden="true"></canvas>
  <video id="fg-video" autoplay loop muted playsinline></video>

  <script>
    (function () {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const rawFile = params.get('file') || '';
      const videoPath = rawFile.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
      const videoUrl = new URL('./' + videoPath, window.location.href).href;

      const bgBlur = document.getElementById('bg-blur');
      const fgVideo = document.getElementById('fg-video');

      let blurEnabled = false;
      let lastBackdropAt = -Infinity;
      function paintBackdrop() {
        if (!blurEnabled || fgVideo.readyState < 2 || !fgVideo.videoWidth) return;
        const scale = 192 / Math.max(fgVideo.videoWidth, fgVideo.videoHeight);
        const width = Math.max(1, Math.round(fgVideo.videoWidth * scale));
        const height = Math.max(1, Math.round(fgVideo.videoHeight * scale));
        if (bgBlur.width !== width || bgBlur.height !== height) {
          bgBlur.width = width;
          bgBlur.height = height;
        }
        bgBlur.getContext('2d')?.drawImage(fgVideo, 0, 0, width, height);
        lastBackdropAt = performance.now();
      }
      fgVideo.addEventListener('loadeddata', paintBackdrop);
      fgVideo.addEventListener('seeked', paintBackdrop);
      // A blurred backdrop only needs occasional samples from the already decoded video.
      fgVideo.addEventListener('timeupdate', () => {
        if (performance.now() - lastBackdropAt >= 83) paintBackdrop();
      });
      fgVideo.src = videoUrl;

      window.__truongpaper_apply_video_adjustments = function (adj) {
        if (!adj) return;
        const fitMode = adj.fitMode || 'fill';
        const fit = { fit_blur: 'contain', fit_black: 'contain', stretch: 'fill', center: 'none' };
        fgVideo.style.objectFit = fit[fitMode] || 'cover';
        const nextBlurEnabled = fitMode === 'fit_blur';
        if (blurEnabled !== nextBlurEnabled) {
          blurEnabled = nextBlurEnabled;
          if (blurEnabled) paintBackdrop();
          bgBlur.style.opacity = blurEnabled ? '1' : '0';
        }

        const muted = Boolean(adj.muted) || (adj.volume ?? 0) <= 0.001;
        fgVideo.muted = muted;
        fgVideo.volume = muted ? 0 : Math.min(1, Math.max(0, Number(adj.volume ?? 1)));

        const rate = Math.min(3.0, Math.max(0.1, Number(adj.playbackSpeed ?? 1.0)));
        if (fgVideo.playbackRate !== rate) fgVideo.playbackRate = rate;

        const zoom = Number(adj.zoom ?? 1.0);
        const ox = Number(adj.offsetX ?? 0.0) * 50;
        const oy = Number(adj.offsetY ?? 0.0) * 50;
        fgVideo.style.transform = zoom === 1 && ox === 0 && oy === 0
          ? 'none' : `scale(${zoom}) translate(${ox}%, ${oy}%)`;

        const br = 1 + Number(adj.brightness ?? 0.0);
        const ct = Number(adj.contrast ?? 1.0);
        const sat = Number(adj.saturation ?? 1.0);
        const hue = Number(adj.hueShift ?? 0.0);
        fgVideo.style.filter = br === 1 && ct === 1 && sat === 1 && hue === 0
          ? 'none' : `brightness(${br}) contrast(${ct}) saturate(${sat}) hue-rotate(${hue}rad)`;
      };

      window.__truongpaper_set_paused = function (paused) {
        if (paused) {
          fgVideo.pause();
        } else {
          fgVideo.play().catch(() => {});
        }
      };

      fgVideo.play().catch(() => {});
    })();
  </script>
</body>
</html>
